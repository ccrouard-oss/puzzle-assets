<section data-bs-version="5.1" class="puzzle-section" id="puzzle-oceans">
  <div class="container-fluid py-4" style="background-color:#f6f8fb;">
    <div class="row justify-content-center text-center">
      <div class="col-12 mb-4">
        <h2 class="mbr-section-title mbr-fonts-style display-5">
          🌊 Puzzle – Protect the Oceans
        </h2>
        <p class="mbr-text mbr-fonts-style mb-4">
          Assemble les pièces pour reconstituer l’image et traduits le message sur la protection des océans.
        </p>
      </div>

      <div class="col-12 d-flex justify-content-center">
        <canvas id="canvas" width="640" height="880" style="border:0; border-radius:12px; box-shadow:0 10px 32px rgba(0,0,0,.08); background:white;">
        </canvas>
      </div>

      <div class="col-12 mt-4">
        <div class="d-flex justify-content-center gap-3">
          <button id="shuffle" class="btn btn-primary">Mélanger</button>
          <button id="reset" class="btn btn-secondary">Réinitialiser</button>
          <span id="status" class="align-self-center text-muted"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    function setup() {
      const cvs = document.getElementById('canvas');
      if (!cvs) { console.error('Canvas introuvable'); return; }
      const ctx = cvs.getContext('2d', { willReadFrequently: true });

      /* ===== CONFIG ===== */
      const IMAGE_URL = "https://ccrouard-oss.github.io/puzzle-assets/protect_the_oceans.png?v=2";
      const ROWS = 5, COLS = 8;
      const TAB_RADIUS_REL = 0.18;
      const TAB_NECK_REL   = 0.55;

      /* ===== Variables globales ===== */
      let img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = init;
      img.onerror = () => document.getElementById('status').textContent = "❌ Image introuvable.";
      img.src = IMAGE_URL;

      const vTabs = Array.from({length: ROWS-1}, () => Array(COLS).fill(0));
      const hTabs = Array.from({length: ROWS},   () => Array(COLS-1).fill(0));
      for (let r=0;r<ROWS-1;r++) for (let c=0;c<COLS;c++)   vTabs[r][c] = Math.random()<0.5?1:-1;
      for (let r=0;r<ROWS;r++)   for (let c=0;c<COLS-1;c++) hTabs[r][c] = Math.random()<0.5?1:-1;

      let W=0,H=0, boardW=0,boardH=0, L=0,T=0, cellW=0,cellH=0, srcW=0,srcH=0;
      let pieces = [];
      let dragging = null, dX = 0, dY = 0;

      function init(){
        W = cvs.width; H = cvs.height;
        const ratio = img.width / img.height; 
        boardH = H * 0.9;
        boardW = boardH * ratio;
        L = (W - boardW)/2; T = (H - boardH)/2;
        cellW = boardW / COLS;
        cellH = boardH / ROWS;
        srcW = img.width  / COLS;
        srcH = img.height / ROWS;
        buildPieces('random');
        installListeners();
        draw();
        document.getElementById('status').textContent = "✅ Puzzle chargé – prêt à jouer.";
      }

      function tabH(g, cx, y0, r, neck, dir){
        const yTip = y0 + dir * r;
        g.bezierCurveTo(cx - neck*0.5, y0, cx - neck*0.5, yTip, cx, yTip);
        g.bezierCurveTo(cx + neck*0.5, yTip, cx + neck*0.5, y0, cx + neck, y0);
      }
      function tabV(g, x0, cy, r, neck, dir){
        const xTip = x0 + dir * r;
        g.bezierCurveTo(x0, cy - neck*0.5, xTip, cy - neck*0.5, xTip, cy);
        g.bezierCurveTo(xTip, cy + neck*0.5, x0,  cy + neck*0.5,  x0,  cy + neck);
      }
      function pathPieceLocal(g, r, c) {
        const rad  = Math.min(cellW, cellH) * TAB_RADIUS_REL;
        const neck = rad * TAB_NECK_REL;
        const Lx = 0, Tx = 0, Rx = cellW, Bx = cellH;
        const midX = cellW/2, midY = cellH/2;
        g.beginPath(); g.moveTo(Lx, Tx);
        if (r===0) g.lineTo(Rx, Tx);
        else { const s = vTabs[r-1][c]; g.lineTo(midX - neck, Tx); tabH(g, midX, Tx, rad, neck, -s); g.lineTo(Rx, Tx); }
        if (c===COLS-1) g.lineTo(Rx, Bx);
        else { const s = hTabs[r][c]; g.lineTo(Rx, midY - neck); tabV(g, Rx, midY, rad, neck,  s); g.lineTo(Rx, Bx); }
        if (r===ROWS-1) g.lineTo(Lx, Bx);
        else { const s = vTabs[r][c]; g.lineTo(midX + neck, Bx); tabH(g, midX, Bx, rad, neck,  s); g.lineTo(Lx, Bx); }
        if (c===0) g.lineTo(Lx, Tx);
        else { const s = hTabs[r][c-1]; g.lineTo(Lx, midY + neck); tabV(g, Lx, midY, rad, neck, -s); g.lineTo(Lx, Tx); }
        g.closePath();
      }
      function makePieceTile(r, c){
        const margin = Math.ceil(Math.min(cellW,cellH) * (TAB_RADIUS_REL + 0.08));
        const w = Math.ceil(cellW + 2*margin);
        const h = Math.ceil(cellH + 2*margin);
        const off = document.createElement('canvas'); off.width = w; off.height = h;
        const g = off.getContext('2d', { willReadFrequently: true });
        g.save(); g.translate(margin, margin);
        pathPieceLocal(g, r, c);
        g.clip();
        const sx = c * srcW, sy = r * srcH;
        g.drawImage(img, sx, sy, srcW, srcH, 0, 0, cellW, cellH);
        g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,0.35)";
        pathPieceLocal(g, r, c); g.stroke();
        g.restore();
        return { tile: off, ax: margin, ay: margin };
      }

      function buildPieces(mode){
        pieces = [];
        for (let r=0;r<ROWS;r++){
          for (let c=0;c<COLS;c++){
            const t = makePieceTile(r,c);
            const targetX = L + (c+0.5)*cellW;
            const targetY = T + (r+0.5)*cellH;
            let x, y;
            if (mode === 'solved') { x = targetX; y = targetY; }
            else { x = L + Math.random()*boardW; y = T + Math.random()*boardH; }
            pieces.push({
              r,c, x,y, targetX, targetY,
              tile: t.tile, ax: t.ax, ay: t.ay,
              w: t.tile.width, h: t.tile.height
            });
          }
        }
        draw();
      }

      function draw(){
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle="#0f131c"; ctx.fillRect(L-8,T-8,boardW+16,boardH+16);
        ctx.fillStyle="#141a24"; ctx.fillRect(L,T,boardW,boardH);
        for (const p of pieces) ctx.drawImage(p.tile, Math.round(p.x - p.ax), Math.round(p.y - p.ay));
      }

      function pick(x,y){
        for(let i=pieces.length-1;i>=0;i--){
          const p=pieces[i];
          if(x>p.x-p.ax && x<p.x-p.ax+p.w && y>p.y-p.ay && y<p.y-p.ay+p.h){
            const lx = Math.floor(x - (p.x - p.ax));
            const ly = Math.floor(y - (p.y - p.ay));
            const a = p.tile.getContext('2d').getImageData(lx,ly,1,1).data[3];
            if (a>8) return {p, i};
          }
        }
        return null;
      }

      function installListeners(){
        cvs.addEventListener('mousedown', e=>{
          const x=e.offsetX, y=e.offsetY;
          const hit=pick(x,y); if(!hit) return;
          pieces.splice(hit.i,1); pieces.push(hit.p);
          dragging = hit.p; dX = x - dragging.x; dY = y - dragging.y;
          draw();
        });
        cvs.addEventListener('mousemove', e=>{
          if(!dragging) return;
          dragging.x = e.offsetX - dX;
          dragging.y = e.offsetY - dY;
          draw();
        });
        window.addEventListener('mouseup', ()=> dragging=null);
        document.getElementById('shuffle').onclick = ()=>{ buildPieces('random'); };
        document.getElementById('reset').onclick   = ()=>{ buildPieces('solved'); document.getElementById('status').textContent="🧩 Puzzle reformé."; };
      }
    } 
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
    else setup();
  })();
  </script>
</section>
